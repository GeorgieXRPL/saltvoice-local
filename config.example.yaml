# Copy to config.yaml or let the app create one on first run.
# No API keys. Speech is transcribed on this PC with Whisper.

listen_mode: wake
auto_sleep_minutes: 8

stt:
  # tiny.en is fastest. base.en is more accurate. small.en is slower/better.
  model: tiny.en
  device: cpu
  compute_type: int8
  language: en

hotkeys:
  toggle_listen: "<ctrl>+<alt>+g"
  hold_talk: "<ctrl>+<cmd>"
  cancel: "<ctrl>+<alt>+x"
  toggle_overlay: "<ctrl>+<alt>+h"

overlay:
  show_on_start: true

remote_bridge:
  enabled: true
  # tailscale = bind the Tailscale IPv4 only (not Wi-Fi / LAN).
  host: tailscale
  port: 8791
  # Leave token empty to auto-create %LOCALAPPDATA%\SaltvoiceLocal\bridge.token
  token: ""
  # false = refuse POST /send-to-grok (phone Grok share only)
  allow_send_to_grok: true

workspace: ""

grok_bot:
  prefer: window
  # grok = paste into Grok Bot (it can then drive other apps)
  # here = paste into whichever app is in front (Notepad, browser, etc.)
  target: grok
  cli: grok
  window_titles:
    - Grok Bot
    - Grok
    - Grok Build

clip:
  # Empty folder/replay_folder use Videos/stream-clips and Videos.
  folder: ""
  replay_folder: ""
  hotkey: "<ctrl>+<alt>+c"
  overlay_url: "http://127.0.0.1:8787/say"
